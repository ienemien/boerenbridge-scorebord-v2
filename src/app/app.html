@if (farmTheme.isActive()) {
  <svg class="farm-background" viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <rect x="0" y="0" width="400" height="460" fill="#bfe3f0" />
    <circle cx="320" cy="90" r="40" fill="#f7d64c" />
    <path d="M0 290 Q100 245 200 290 T400 290 V460 H0 Z" fill="#8fbf6a" />
    <path d="M0 340 Q100 300 200 340 T400 340 V460 H0 Z" fill="#79ab57" />
    <rect x="0" y="460" width="400" height="340" fill="#5a9a44" />
    <g transform="translate(40,360)">
      <rect x="0" y="30" width="80" height="62" fill="#c6402f" />
      <polygon points="-10,30 40,-6 90,30" fill="#7a2c20" />
      <rect x="30" y="58" width="20" height="34" fill="#7a2c20" />
    </g>
    <g transform="translate(230,395)">
      <rect x="0" y="15" width="52" height="24" rx="3" fill="#3f7d3a" />
      <rect x="8" y="-10" width="26" height="26" rx="3" fill="#3f7d3a" />
      <circle cx="12" cy="46" r="12" fill="#2b2b2b" />
      <circle cx="42" cy="46" r="12" fill="#2b2b2b" />
      <circle cx="12" cy="46" r="4" fill="#8a8a8a" />
      <circle cx="42" cy="46" r="4" fill="#8a8a8a" />
    </g>
    <g transform="translate(230,520)">
      <ellipse cx="46" cy="70" rx="52" ry="30" fill="#fbf7f0" />
      <circle cx="92" cy="52" r="23" fill="#fbf7f0" />
      <ellipse cx="16" cy="58" rx="14" ry="18" fill="#2b2b2b" />
      <ellipse cx="48" cy="76" rx="12" ry="15" fill="#2b2b2b" />
      <circle cx="100" cy="46" r="3" fill="#2b2b2b" />
      <ellipse cx="107" cy="60" rx="9" ry="6" fill="#f4c6c6" />
      <rect x="6" y="90" width="9" height="20" fill="#fbf7f0" />
      <rect x="70" y="90" width="9" height="20" fill="#fbf7f0" />
    </g>
  </svg>
}

<mat-toolbar>
  <button class="app-title" type="button" routerLink="/home" (click)="registerTitleTap()">
    @if (farmTheme.isActive()) {
      🚜
    }
    Boerenbridge Scorebord
  </button>
  <span class="spacer"></span>
  <button
    mat-icon-button
    type="button"
    (click)="theme.toggle()"
    [attr.aria-label]="theme.isDark() ? 'Schakel naar lichte modus' : 'Schakel naar donkere modus'"
  >
    <mat-icon>{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>
  <button mat-icon-button type="button" [matMenuTriggerFor]="menu" aria-label="Menu">
    <mat-icon>menu</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    <button mat-menu-item type="button" routerLink="/">
      <mat-icon>sports_esports</mat-icon>
      <span>Terug naar spel</span>
    </button>
    <button mat-menu-item type="button" routerLink="/scoreboard">
      <mat-icon>leaderboard</mat-icon>
      <span>Scorebord</span>
    </button>
    <mat-divider></mat-divider>
    <button mat-menu-item type="button" (click)="startNewGame()">
      <mat-icon>replay</mat-icon>
      <span>Nieuw spel</span>
    </button>
  </mat-menu>
</mat-toolbar>

<main class="app-content">
  <router-outlet />
</main>
