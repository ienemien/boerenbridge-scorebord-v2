<h2>Spelers</h2>
<p class="subtitle">Voeg minimaal 2 en maximaal 8 spelers toe</p>

@if (players().length > 0) {
  <div class="player-list" cdkDropList (cdkDropListDropped)="reorder($event)">
    @for (player of players(); track player.id) {
      <div class="player-row" cdkDrag>
        <mat-icon class="drag-handle" cdkDragHandle aria-hidden="true">drag_indicator</mat-icon>
        <app-player-avatar [player]="player" [size]="40" />
        <span class="player-name">{{ player.name }}</span>
        <button
          mat-icon-button
          type="button"
          class="dealer-button"
          [class.dealer-button-active]="player.id === (startingDealerId() ?? players()[0].id)"
          (click)="setDealer(player.id)"
          [attr.aria-pressed]="player.id === (startingDealerId() ?? players()[0].id)"
          [attr.aria-label]="'Maak ' + player.name + ' deler'"
        >
          <mat-icon>style</mat-icon>
        </button>
        <button mat-icon-button type="button" (click)="removePlayer(player.id)" aria-label="Verwijder speler">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    }
  </div>
}

<form class="add-player-row" (ngSubmit)="addPlayer()">
  <mat-form-field appearance="outline">
    <mat-label>Voornaam</mat-label>
    <input
      matInput
      name="newPlayerName"
      [ngModel]="newPlayerName()"
      (ngModelChange)="newPlayerName.set($event)"
    />
  </mat-form-field>
  <button mat-stroked-button type="submit">
    <mat-icon>add</mat-icon>
    Voeg speler toe
  </button>
</form>

<button mat-flat-button color="primary" type="button" (click)="startGame()">Start spel</button>
