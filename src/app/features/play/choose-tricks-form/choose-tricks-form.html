<h2>Kies aantal gekozen slagen</h2>
<p class="subtitle">Aantal kaarten: {{ step().nrOfCards }} · Nog te kiezen: {{ remaining() }}</p>

<form class="tricks-form">
  @for (player of players(); track player.id) {
    <div class="player-row">
      <app-player-avatar [player]="player" />
      <mat-form-field appearance="outline">
        <mat-label>
          {{ player.name }}
          @if (player.id === step().dealerId) {
            <mat-icon class="dealer-icon" aria-label="Deler" inline>style</mat-icon>
          }
        </mat-label>
        <mat-select [value]="valueFor(player.id)" (selectionChange)="select(player.id, $event.value)">
          @for (option of tricksOptions(); track option) {
            <mat-option [value]="option">{{ option }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
  }
</form>
<button mat-flat-button color="primary" type="button" (click)="save()">Start ronde</button>
