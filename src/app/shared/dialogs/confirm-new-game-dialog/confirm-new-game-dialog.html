<h2 mat-dialog-title>Nieuw spel starten?</h2>
<mat-dialog-content>Het huidige spel wordt gewist en kan niet worden hersteld.</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Annuleren</button>
  <button mat-flat-button color="warn" (click)="confirm()">Nieuw spel</button>
</mat-dialog-actions>
