<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BoerenbridgeScorebordV2</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&amp;display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      // Some hosts serve .webmanifest as application/octet-stream (unknown MIME
      // type), which makes Chrome silently refuse installability even though the
      // file itself loads fine. Re-fetch it and re-expose it via a blob: URL with
      // the correct type, sidestepping the server's Content-Type entirely.
      fetch('manifest.webmanifest')
        .then((response) => response.blob())
        .then((blob) => {
          const link = document.querySelector('link[rel="manifest"]');
          link.href = URL.createObjectURL(new Blob([blob], { type: 'application/manifest+json' }));
        })
        .catch(() => {});
    </script>
    <meta name="theme-color" content="#1f2022" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Boerenbridge" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
